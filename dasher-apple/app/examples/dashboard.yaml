# Dasher Apple dashboard. Edit and save; connected tablets reload automatically.
# Replace the example entity IDs with entities from your Home Assistant.

title: Home
language: en
# locale: en-GB

# These sections control the corresponding dashboard pages.
areas:
  # enabled: false
  # hide: [garage]
  # overrides:
  #   living_room: { name: Lounge, temperature_entity: sensor.lounge_temperature }

music:
  # enabled: false
  # players: [media_player.kitchen, media_player.living_room]
  # exclude: [media_player.bedroom]

ev:
  # enabled: false
  # battery_entity: sensor.my_car_battery
  # range_entity: sensor.my_car_range
  # plug_entity: sensor.my_car_plug_status

climate:
  # source: helpers  # helpers | all
  # entities: [climate.living_room, climate.office]

plex:
  # enabled: false
  # players: [media_player.living_room_tv]

# Read-only calendar page; set to true to show all Home Assistant calendars.
# calendar:
#   entities: [calendar.family, calendar.work]

pages:
  - id: home
    title: Home
    tiles:
      - type: hero
        # weather_entity: weather.forecast_home
        buttons:
          - { icon: weather-night, name: Good night, entity: input_boolean.good_night }
          - { icon: palm-tree, name: Vacation, entity: input_boolean.vacation }
          - { icon: lightbulb-group, name: All lights, entity: light.living_room_lamp }

      - type: calendar
        # entities: [calendar.family, calendar.work]  # default: all calendars
        weather_entity: weather.forecast_home
        days: 7

      - type: media
        entities: music  # Music Assistant speakers, or a list of media_player IDs

      - type: vehicle
        name: Car
        entity: sensor.car_range
        rows:
          - { entity: sensor.car_battery }
          - { entity: sensor.car_fuel_level }

      - type: toggle
        name: All lights
        entity: light.living_room_lamp
