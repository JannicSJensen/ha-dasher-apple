configuration:
  log_level:
    name: Log level
    description: "How much the app writes to its log."
  read_only:
    name: Read-only
    description: "Show states on the tablets but refuse every command from them."
  weather_background:
    name: Automatic weather entity
    description: "Automatically use the calendar tile's weather entity, or the first Home Assistant weather entity, for the home face. Restart after changing."
  legacy_faces:
    name: Dashboard faces
    description: "Choose and order the faces available at /legacy/. Existing dashboard pages remain available in the page menu. Restart after changing."
  legacy_wallpaper:
    name: Dashboard wallpaper
    description: "Optional JPEG, PNG or GIF filename in the app's assets folder. Leave empty for the built-in background. Restart after changing."
  legacy_photos:
    name: Photo albums
    description: "Allow the legacy photo face to show images from assets/photos. Anyone who can reach the app's direct port can view these photos. Restart after changing."
  legacy_photo_albums:
    name: Photo album folders
    description: "Folder names directly inside assets/photos. Leave empty to include all folders and photos in assets/photos itself. When set, only named folders are included. Restart after changing."
  legacy_photo_interval:
    name: Photo interval
    description: "Seconds between photos (10–3600). Restart after changing."
  legacy_cameras:
    name: Camera snapshots
    description: "Expose all discovered HA camera snapshots to the legacy camera face. Anyone who can reach the app's direct port can view them, including cameras added later. Disabled by default. Restart after changing. The existing general image proxy is separate from this option."
  legacy_camera_interval:
    name: Camera refresh
    description: "Seconds between camera snapshots (10–3600). Restart after changing."
  entity_map:
    name: Entity mapping
    description: "Use entities of your Home Assistant in place of the ones dashboard.yaml names, without editing the file. Each row has the entity id as written in dashboard.yaml (From) and the entity to use instead (To); both must be of the same kind (a light for a light, a sensor for a sensor). Dashboard entities that Home Assistant does not know are shown at the bottom of the tablet page and listed in the app log with suggestions. Restart the app after changing."
    fields:
      from:
        name: Dashboard entity
        description: "The entity id as written in dashboard.yaml, for example sensor.car_range."
      to:
        name: Home Assistant entity
        description: "The entity of your Home Assistant to use instead, for example sensor.fordpass_elveh."
  menu_items:
    name: Menu items
    description: "Rows for supported built-in and dashboard pages are added automatically when the app starts or dashboard.yaml changes. Refresh this page to see them. Set Visibility to hide, show or default. Overrides take precedence over dashboard.yaml and the Calendar switch. Restart the app after changing."
    fields:
      id:
        name: Menu item ID
        description: "A built-in ID or a page id from dashboard.yaml. Prefix custom ids with page: if they collide with a built-in ID."
      visibility:
        name: Visibility
        description: "Choose default to keep the existing setting, show to enable the page, or hide to remove it from the menu. Overrides the legacy Visible field."
      visible:
        name: Visible (legacy)
        description: "Older true/false override, used only when Visibility is unset. Use Visibility instead."
      title:
        name: Label
        description: "The menu label. Leave empty to keep the existing or translated label."
      icon:
        name: Icon
        description: "A Material Design Icon name, for example mdi:home. Leave empty to keep the existing icon."
      order:
        name: Order
        description: "Position starting at 0. Lower numbers appear first; ties keep the original order. Leave unset to keep the original position. The first visible page is the home and idle-return page."
  allow_area_picture_upload:
    name: Put room pictures on the areas
    description: "Lets the app give areas that have no picture a built-in room picture in Home Assistant itself (Settings, Areas), once per area. Pictures you choose yourself are never changed. Turn off to keep the pictures out of Home Assistant's area settings."
  enable_calendar:
    name: Calendar page
    description: "Switches on a read-only agenda for all Home Assistant calendars. A `calendar:` section in dashboard.yaml can select calendars, and `calendar: false` turns the page off. Restart after changing."
